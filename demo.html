<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Union ID in Apple Wallet · Demo</title>
<meta name="description" content="Demo prepared for Union University: your Union ID QR in Apple Wallet.">
<meta name="theme-color" content="#f4f0ec">
<meta name="color-scheme" content="light">
<meta name="robots" content="noindex">
<style>
  @font-face{font-family:M;src:url(/fonts/montserrat-latin-500-normal.woff2) format("woff2");font-weight:500;font-display:swap}
  @font-face{font-family:M;src:url(/fonts/montserrat-latin-600-normal.woff2) format("woff2");font-weight:600;font-display:swap}
  @font-face{font-family:M;src:url(/fonts/montserrat-latin-700-normal.woff2) format("woff2");font-weight:700;font-display:swap}
  @font-face{font-family:G;src:url(/fonts/sorts-mill-goudy-latin-400-normal.woff2) format("woff2");font-display:swap}
  @font-face{font-family:G;src:url(/fonts/sorts-mill-goudy-latin-400-italic.woff2) format("woff2");font-style:italic;font-display:swap}
  :root{--c:#990026;--ink:#1a1a1a;--mut:#5c5650;--line:#e0d9d1;--bg:#f4f0ec;--ok:#127a4a;--err:#b42318}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:M,-apple-system,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  main{max-width:440px;margin:0 auto;padding:26px 24px 40px}
  .logo{display:block;width:250px;max-width:80%;margin:0 auto}
  .rule{height:1px;background:var(--line);margin:18px -24px 0}
  .stage{margin:26px 0 22px;padding:0 24px}
  .pass{background:var(--c);color:#fff;border-radius:16px;padding:16px 18px 18px;box-shadow:0 14px 30px rgba(153,0,38,.25)}
  .pass .top{font-weight:700;font-size:15px;letter-spacing:.02em}
  .pass .lab{font-size:9.5px;letter-spacing:.08em;opacity:.8;margin-top:14px}
  .pass .val{font-size:19px;font-weight:500}
  .pass .qr{background:#fff;color:#000;width:118px;margin:16px auto 0;border-radius:8px;padding:10px 10px 5px;text-align:center;font-size:11px}
  .qrsvg{display:block;width:98px;height:98px;margin:0 auto 4px}
  h1{font-family:G;font-weight:400;font-size:33px;line-height:1.1;margin:0 0 8px;text-align:center}
  h1 em{color:var(--c)}
  .lede{text-align:center;color:var(--mut);font-size:14.5px;line-height:1.45;margin:0 0 20px}
  .upload{display:block;cursor:pointer}
  .pick,.wallet{width:100%;height:54px;border:0;border-radius:12px;background:#000;color:#fff;font:600 16px M,system-ui,sans-serif;display:flex;align-items:center;justify-content:center;gap:10px;cursor:pointer}
  .upload:active .pick{opacity:.85}
  input[type=file]{display:none}
  .status{margin-top:14px;font-size:14.5px;text-align:center}
  .status:empty{display:none}
  .status.ok{color:var(--ok)} .status.err{color:var(--err)}
  .found{display:none;margin-top:14px}
  .found img{width:100%;border-radius:12px;border:1px solid var(--line);max-height:200px;object-fit:contain;background:#fff}
  .code{font-family:ui-monospace,Menlo,monospace;font-size:14px;margin:10px 0 14px;color:var(--mut);text-align:center}
  .wallet:disabled{opacity:.5}
  .again{display:block;margin:12px auto 0;background:none;border:0;color:var(--mut);font-size:14px;text-decoration:underline;cursor:pointer}
  .note{display:none;margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff;border:1px solid var(--line);font-size:13.5px;color:var(--mut);text-align:center}
  .priv{font-size:13px;color:#6b645d;text-align:center;margin-top:16px}
  footer{margin-top:26px;font-size:11.5px;color:#9a928a;text-align:center}
</style>
</head>
<body>
<main>
  <img class="logo" src="/union-logo.png" alt="Union University">
  <div class="rule"></div>

  <div class="stage" aria-hidden="true">
    <div class="pass">
      <div class="top">Union ID</div>
      <div class="lab">SCAN FOR</div>
      <div class="val">Dining, Chapel &amp; more</div>
      <div class="qr"><svg class="qrsvg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 21 21" shape-rendering="crispEdges"><path fill="#ffffff" d="M0 0h21v21H0z"/><path stroke="#000000" d="M0 0.5h7m1 0h1m1 0h1m3 0h7M0 1.5h1m5 0h1m1 0h1m5 0h1m5 0h1M0 2.5h1m1 0h3m1 0h1m1 0h2m4 0h1m1 0h3m1 0h1M0 3.5h1m1 0h3m1 0h1m2 0h4m1 0h1m1 0h3m1 0h1M0 4.5h1m1 0h3m1 0h1m1 0h2m2 0h1m1 0h1m1 0h3m1 0h1M0 5.5h1m5 0h1m2 0h4m1 0h1m5 0h1M0 6.5h7m1 0h1m1 0h1m1 0h1m1 0h7M9 7.5h4M0 8.5h1m2 0h6m1 0h1m1 0h2m2 0h1m1 0h3M0 9.5h4m1 0h1m2 0h3m1 0h1m1 0h1m1 0h4M2 10.5h3m1 0h2m2 0h1m2 0h2m1 0h1M0 11.5h2m1 0h3m3 0h1m1 0h1m5 0h4M1 12.5h1m1 0h1m2 0h1m1 0h2m4 0h1m2 0h1m2 0h1M8 13.5h1m1 0h3m2 0h1m2 0h3M0 14.5h7m1 0h3m1 0h7m1 0h1M0 15.5h1m5 0h1m1 0h1m2 0h3m1 0h3m1 0h2M0 16.5h1m1 0h3m1 0h1m1 0h1m1 0h3m1 0h2m1 0h2m1 0h1M0 17.5h1m1 0h3m1 0h1m1 0h5m3 0h3M0 18.5h1m1 0h3m1 0h1m2 0h1m4 0h1m2 0h4M0 19.5h1m5 0h1m3 0h1m2 0h2m1 0h1m1 0h1m1 0h1M0 20.5h7m1 0h2m1 0h1m6 0h2"/></svg>1234567</div>
    </div>
  </div>

  <h1>Your Union ID,<br><em>in Apple Wallet.</em></h1>
  <p class="lede">Dining, chapel, and more. Double-click and scan.</p>

  <label class="upload" id="drop">
    <span class="pick">
      <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/></svg>
      Add to Apple Wallet
    </span>
    <input type="file" id="file" accept="image/*">
  </label>

  <div class="status" id="status" role="status" aria-live="polite"></div>

  <div class="found" id="found">
    <img id="preview" alt="Your screenshot">
    <div class="code" id="codeShown"></div>
    <form id="passForm" method="POST" action="/api/pass">
      <input type="hidden" name="code" id="codeField">
      <button class="wallet" id="walletBtn" type="submit">
        <svg width="22" height="22" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3" fill="none" stroke="currentColor" stroke-width="2"/><path d="M3 10h18" stroke="currentColor" stroke-width="2"/></svg>
        Add to Apple Wallet
      </button>
    </form>
    <button class="again" id="again" type="button">Use a different screenshot</button>
  </div>

  <div class="note" id="iosNote">Open this page in Safari on your iPhone to add the pass to Wallet.</div>

  <p class="priv">Your screenshot stays on your phone. Nothing gets saved.</p>
  <footer>Demo prepared for Union University</footer>
</main>

<script src="/jsQR.js"></script>
<script>
(function () {
  // Keep this in sync with CODE_PATTERN on the server.
  var CODE_PATTERN = /^[A-Za-z0-9_\-]{4,64}$/;

  var fileInput = document.getElementById("file");
  var statusEl = document.getElementById("status");
  var found = document.getElementById("found");
  var preview = document.getElementById("preview");
  var codeShown = document.getElementById("codeShown");
  var codeField = document.getElementById("codeField");
  var walletBtn = document.getElementById("walletBtn");
  var drop = document.getElementById("drop");
  var objectUrl = null;

  var isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  if (!isIOS) document.getElementById("iosNote").style.display = "block";

  function setStatus(msg, kind) {
    statusEl.textContent = msg;
    statusEl.className = "status" + (kind ? " " + kind : "");
  }

  function mask(code) {
    if (code.length <= 4) return code;
    return "•".repeat(code.length - 4) + code.slice(-4);
  }

  // Try a few sizes, since a small QR inside a full-screen screenshot can be missed at one scale.
  function decode(img) {
    var sizes = [1600, 1000, 2400, 700];
    var canvas = document.createElement("canvas");
    var ctx = canvas.getContext("2d", { willReadFrequently: true });
    for (var i = 0; i < sizes.length; i++) {
      var scale = Math.min(1, sizes[i] / Math.max(img.naturalWidth, img.naturalHeight));
      canvas.width = Math.round(img.naturalWidth * scale);
      canvas.height = Math.round(img.naturalHeight * scale);
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      var data = ctx.getImageData(0, 0, canvas.width, canvas.height);
      var result = jsQR(data.data, data.width, data.height, { inversionAttempts: "attemptBoth" });
      if (result && result.data) return result.data;
    }
    return null;
  }

  function reset() {
    found.style.display = "none";
    drop.style.display = "flex";
    codeField.value = "";
    fileInput.value = "";
    if (objectUrl) { URL.revokeObjectURL(objectUrl); objectUrl = null; }
    setStatus("");
  }

  fileInput.addEventListener("change", function () {
    var file = fileInput.files && fileInput.files[0];
    if (!file) return;
    setStatus("Reading your QR code…");
    if (objectUrl) URL.revokeObjectURL(objectUrl);
    objectUrl = URL.createObjectURL(file);
    var img = new Image();
    img.onload = function () {
      var code = decode(img);
      if (!code) {
        setStatus("Couldn't find a QR code in that image. Try a sharper screenshot.", "err");
        return;
      }
      code = code.trim();
      if (!CODE_PATTERN.test(code)) {
        setStatus("Found a QR code, but it doesn't look like a Union ID code.", "err");
        return;
      }
      codeField.value = code;
      codeShown.textContent = "Code found: " + mask(code);
      preview.src = objectUrl;
      drop.style.display = "none";
      found.style.display = "block";
      setStatus("Opening Wallet…", "ok");
      // Go straight to Wallet. The button below stays as a backup.
      setTimeout(function () {
        walletBtn.disabled = true;
        document.getElementById("passForm").submit();
        setTimeout(function () { walletBtn.disabled = false; setStatus("If Wallet didn't open, tap the button.", ""); }, 4000);
      }, 400);
    };
    img.onerror = function () { setStatus("That file isn't an image we can read.", "err"); };
    img.src = objectUrl;
  });

  document.getElementById("passForm").addEventListener("submit", function () {
    walletBtn.disabled = true;
    setStatus("Making your pass…");
    setTimeout(function () { walletBtn.disabled = false; setStatus("If Wallet didn't open, tap the button again.", ""); }, 6000);
  });

  document.getElementById("again").addEventListener("click", reset);
})();
</script>
</body>
</html>
